name: AlignMate CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Lint and Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r AlignMate/requirements.txt

      - name: Syntax Compilation Check
        run: |
          python -m compileall AlignMate/

      - name: Run Backend Tests
        run: |
          python -m pytest AlignMate/
        env:
          DATABASE_URL: sqlite:///test.db

  frontend-ci:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./alignmate-frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./alignmate-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Build Test
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  docker-build-ci:
    name: Docker Build Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t alignmate-backend-test ./AlignMate

      - name: Build Frontend Docker Image
        run: |
          docker build -t alignmate-frontend-test ./alignmate-frontend
